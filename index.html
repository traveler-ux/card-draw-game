<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獎勵萌抽卡 - 終極史詩版</title>
    <!-- 使用 CDN 載入必要的套件 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 canvas-confetti 彩帶特效套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; margin: 0; overflow: hidden; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fed7aa; border-radius: 10px; }
        
        /* 基礎動畫 */
        @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-zoom-in { animation: zoom-in 0.4s ease-out forwards; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 3s linear infinite; }

        /* --- 💥 終極特效區 💥 --- */
        @keyframes hyper-shake {
            0%, 100% { transform: translate(0, 0) rotate(0) scale(1); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-4px, -4px) rotate(-2deg) scale(1.02); }
            20%, 40%, 60%, 80% { transform: translate(4px, 4px) rotate(2deg) scale(0.98); }
        }
        .animate-hyper-shake { animation: hyper-shake 0.1s ease-in-out infinite; }
        
        @keyframes warning-pulse {
            0%, 100% { box-shadow: inset 0 0 20px rgba(220, 38, 38, 0); background-color: rgba(220, 38, 38, 0); }
            50% { box-shadow: inset 0 0 100px rgba(220, 38, 38, 0.4); background-color: rgba(220, 38, 38, 0.1); }
        }
        .warning-overlay { animation: warning-pulse 0.5s infinite; pointer-events: none; }

        .card-container { perspective: 1000px; }
        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
        }
        .card-back {
            background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #334155 10px, #334155 20px);
            border: 4px solid #64748b;
            display: flex; justify-content: center; align-items: center;
        }
        .card-front { transform: rotateY(180deg); }

        @keyframes flash-bang {
            0% { opacity: 1; background-color: #ffffff; }
            100% { opacity: 0; background-color: #ffffff; display: none; }
        }
        .animate-flash-bang { animation: flash-bang 1.5s ease-out forwards; }

        @keyframes legendary-glow {
            0%, 100% { box-shadow: 0 0 40px #fbbf24, inset 0 0 25px #fbbf24; border-color: #fef08a; }
            50% { box-shadow: 0 0 100px #f59e0b, inset 0 0 50px #f59e0b; border-color: #fbbf24; }
        }
        .legendary-card { animation: legendary-glow 1s infinite alternate; }

        @keyframes epic-glow {
            0%, 100% { box-shadow: 0 0 40px #a855f7, inset 0 0 25px #a855f7; border-color: #d8b4fe; }
            50% { box-shadow: 0 0 100px #9333ea, inset 0 0 50px #9333ea; border-color: #a855f7; }
        }
        .epic-card { animation: epic-glow 1s infinite alternate; }

        @keyframes rare-glow {
            0%, 100% { box-shadow: 0 0 40px #0ea5e9, inset 0 0 25px #0ea5e9; border-color: #7dd3fc; }
            50% { box-shadow: 0 0 100px #0284c7, inset 0 0 50px #0284c7; border-color: #0ea5e9; }
        }
        .rare-card { animation: rare-glow 1s infinite alternate; }

        .bg-rays {
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.5) 20deg, transparent 40deg, rgba(255,255,255,0.5) 60deg, transparent 80deg, rgba(255,255,255,0.5) 100deg, transparent 120deg, rgba(255,255,255,0.5) 140deg, transparent 160deg, rgba(255,255,255,0.5) 180deg, transparent 200deg, rgba(255,255,255,0.5) 220deg, transparent 240deg, rgba(255,255,255,0.5) 260deg, transparent 280deg, rgba(255,255,255,0.5) 300deg, transparent 320deg, rgba(255,255,255,0.5) 340deg, transparent 360deg);
            animation: spin-slow 8s linear infinite;
            z-index: -1;
        }

        /* 🌟 核心：圖案立體化專屬樣式區 🌟 */
        .icon-area { position: relative; }
        
        @keyframes icon-rays {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .icon-rays-inner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140%; height: 140%; border-radius: 50%;
            background: conic-gradient(transparent, currentColor, transparent);
            opacity: 0.15; animation: icon-rays 4s linear infinite; z-index: -1;
            mix-blend-mode: screen; filter: blur(3px);
        }

        .exquisite-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .icon-shadow { opacity: 0.4; filter: blur(1.5px); color: #000; scale: 1.05; }
        .icon-neon { stroke-width: 3; filter: drop-shadow(0 0 6px currentColor); opacity: 0.9; }
        .icon-main-stroke { stroke-width: 2.5; filter: drop-shadow(0 0 1px currentColor) }

        .legendary-card .icon-neon, .legendary-card .icon-main-stroke { color: #fef08a; }
        .epic-card .icon-neon, .epic-card .icon-main-stroke { color: #d8b4fe; }
        .rare-card .icon-neon, .rare-card .icon-main-stroke { color: #7dd3fc; }
        .common-card .icon-neon, .common-card .icon-main-stroke { color: #f1f5f9; }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const Icon = ({ name, className }) => {
            return <i data-lucide={name.toLowerCase()} className={className}></i>;
        };

        const availableIcons = ['Star', 'Gift', 'Heart', 'Zap', 'Crown', 'Shield-Alert', 'Coffee', 'Music', 'Sparkles', 'Map-Pin', 'Cookie', 'Flame', 'Thumbs-Up', 'Smile', 'Sun', 'Moon', 'Book', 'User-Check', 'Chevron-Right', 'Plus', 'PlusCircle', 'History'];

        const rarityColorMap = {
            common: 'bg-stone-500',
            rare: 'bg-blue-500',
            epic: 'bg-purple-500',
            legendary: 'bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600'
        };

        const initialItems = [
            { name: "記得微笑", detail: "老師請記得微笑", count: 1, icon: 'Heart', color: 'bg-stone-500', rarity: 'common' },
            { name: "命運的小禮物", detail: "由轉盤抽出小禮物", count: 5, icon: 'Gift', color: 'bg-stone-500', rarity: 'common' },
            { name: "短文免寫", detail: "短文免寫二次", count: 10, icon: 'Star', color: 'bg-blue-500', rarity: 'rare' },
            { name: "免午休", detail: "獲得3天自由午休時間", count: 10, icon: 'Coffee', color: 'bg-blue-500', rarity: 'rare' },
            { name: "值日生", detail: "值日生PASS一次", count: 10, icon: 'User-Check', color: 'bg-blue-500', rarity: 'rare' },
            { name: "免死金牌", detail: "抵銷一次處罰", count: 5, icon: 'Shield-Alert', color: 'bg-purple-500', rarity: 'epic' },
            { name: "點歌時間", detail: "可以在12:30前點歌在班上放", count: 15, icon: 'Music', color: 'bg-purple-500', rarity: 'epic' },
            { name: "聯絡簿讚美", detail: "獲得老師的讚美", count: 9, icon: 'Sparkles', color: 'bg-blue-500', rarity: 'rare' },
            { name: "老師座", detail: "可坐老師的座位半天", count: 4, icon: 'Crown', color: 'bg-purple-500', rarity: 'epic' },
            { name: "活動大進擊", detail: "全班增加活動時間", count: 5, icon: 'Zap', color: 'bg-purple-500', rarity: 'epic' },
            { name: "三日座位", detail: "自選座位三天", count: 5, icon: 'Map-Pin', color: 'bg-blue-500', rarity: 'rare' },
            { name: "優先選擇", detail: "獲得優先選擇權", count: 10, icon: 'Chevron-Right', color: 'bg-blue-500', rarity: 'rare' },
            { name: "零食時間", detail: "獲得吃零食的自由時間", count: 10, icon: 'Cookie', color: 'bg-blue-500', rarity: 'rare' },
            { name: "再抽1+1", detail: "好運連連，再抽兩張", count: 1, icon: 'Flame', color: 'bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600', rarity: 'legendary' },
        ];

        function App() {
            const [view, setView] = useState('home');
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('epicRewards_items_v5');
                // Migrate colors from old versions just in case
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return parsed.map(item => ({...item, color: rarityColorMap[item.rarity] || item.color}));
                }
                return initialItems;
            });
            const [drawCount, setDrawCount] = useState(1);
            
            const [rollPhase, setRollPhase] = useState('idle');
            const [showFlash, setShowFlash] = useState(false);
            const [results, setResults] = useState([]);
            const [revealedIdxs, setRevealedIdxs] = useState([]);
            
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('epicRewards_history_v5');
                return saved ? JSON.parse(saved) : [];
            });
            const [seatNumber, setSeatNumber] = useState('');
            const [newItem, setNewItem] = useState({ name: '', detail: '', count: 1, rarity: 'common', icon: 'Star' });

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('epicRewards_items_v5', JSON.stringify(items));
                localStorage.setItem('epicRewards_history_v5', JSON.stringify(history));
                if (window.lucide) window.lucide.createIcons();
            }, [items, history, view, results, rollPhase, revealedIdxs]);

            const totalCards = useMemo(() => items.reduce((sum, item) => sum + item.count, 0), [items]);
            const rewardPool = useMemo(() => {
                let pool = [];
                items.forEach(item => {
                    for (let i = 0; i < item.count; i++) pool.push(item);
                });
                return pool;
            }, [items]);

            const speakCardRarity = (rarity) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    
                    let text = "";
                    let pitch = 0.6; 
                    let rate = 1.0;
                    
                    if (rarity === 'legendary') {
                        text = "傳說！！"; 
                        pitch = 0.8; 
                        rate = 0.85; 
                    } else if (rarity === 'epic') {
                        text = "史詩！";
                        pitch = 0.7;
                        rate = 1.0;
                    }

                    if (text !== "") {
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'zh-TW'; 
                        utterance.rate = rate;     
                        utterance.pitch = pitch;  
                        utterance.volume = 1.0;   
                        
                        const voices = window.speechSynthesis.getVoices();
                        const maleVoice = voices.find(v => 
                            (v.lang.includes('zh') || v.lang.includes('cmn')) && 
                            (v.name.includes('Zhiwei') || v.name.includes('Male') || v.name.includes('男') || v.name.includes('Kangkang') || v.name.includes('Yunjian'))
                        );
                        
                        if (maleVoice) { utterance.voice = maleVoice; }
                        
                        window._currentUtterance = utterance;
                        window.speechSynthesis.speak(utterance);
                    }
                }
            };

            const playCardRevealSound = (rarity) => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    if (ctx.state === 'suspended') ctx.resume();
                    const now = ctx.currentTime;
                    
                    if (rarity === 'legendary') {
                        const bass = ctx.createOscillator();
                        const bassGain = ctx.createGain();
                        bass.type = 'square';
                        bass.frequency.setValueAtTime(100, now);
                        bass.frequency.exponentialRampToValueAtTime(10, now + 1.5);
                        bass.connect(bassGain); bassGain.connect(ctx.destination);
                        bassGain.gain.setValueAtTime(0, now);
                        bassGain.gain.linearRampToValueAtTime(0.6, now + 0.05);
                        bassGain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
                        bass.start(now); bass.stop(now + 2.0);
                        
                        [440, 554, 659, 880].forEach(freq => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(freq, now);
                            osc.frequency.linearRampToValueAtTime(freq + 50, now + 1.0);
                            osc.connect(gain); gain.connect(ctx.destination);
                            gain.gain.setValueAtTime(0, now);
                            gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                            osc.start(now); osc.stop(now + 1.5);
                        });
                        return;
                    }

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if (rarity === 'common') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(450, now);
                        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.15);
                    } else if (rarity === 'rare') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(700, now);
                        osc.frequency.setValueAtTime(1000, now + 0.1);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.1);
                        gain.gain.linearRampToValueAtTime(0.4, now + 0.11);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.35);
                    } else if (rarity === 'epic') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.setValueAtTime(1200, now + 0.1);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                        osc.start(now);
                        osc.stop(now + 0.55);
                    }
                } catch (e) { console.log("Audio skipped."); }
            };

            const playAudioEffects = () => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    if (ctx.state === 'suspended') ctx.resume();
                    const now = ctx.currentTime;

                    const riserOsc = ctx.createOscillator();
                    const riserGain = ctx.createGain();
                    riserOsc.connect(riserGain); riserGain.connect(ctx.destination);
                    riserOsc.type = 'sawtooth';
                    riserOsc.frequency.setValueAtTime(50, now);
                    riserOsc.frequency.exponentialRampToValueAtTime(1500, now + 4);
                    riserGain.gain.setValueAtTime(0, now);
                    riserGain.gain.linearRampToValueAtTime(0.1, now + 0.5);
                    riserGain.gain.exponentialRampToValueAtTime(0.001, now + 4.1);
                    riserOsc.start(now); riserOsc.stop(now + 4.2);

                    const ticks = 40;
                    for (let i = 0; i < ticks; i++) {
                        const progress = i / ticks;
                        const timeOffset = 4 * Math.pow(progress, 1.5); 
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(400 + (progress * 800), now + timeOffset); 
                        gain.gain.setValueAtTime(0, now + timeOffset);
                        gain.gain.linearRampToValueAtTime(0.1, now + timeOffset + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + 0.05);
                        osc.start(now + timeOffset); osc.stop(now + timeOffset + 0.1);
                    }
                    
                    setTimeout(() => {
                        const t = ctx.currentTime;
                        const kickOsc = ctx.createOscillator();
                        const kickGain = ctx.createGain();
                        kickOsc.connect(kickGain); kickGain.connect(ctx.destination);
                        kickOsc.type = 'sine';
                        kickOsc.frequency.setValueAtTime(200, t);
                        kickOsc.frequency.exponentialRampToValueAtTime(10, t + 0.5);
                        kickGain.gain.setValueAtTime(0, t);
                        kickGain.gain.linearRampToValueAtTime(0.8, t + 0.02);
                        kickGain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
                        kickOsc.start(t); kickOsc.stop(t + 2);
                    }, 4000);
                } catch (e) { console.log("Audio skipped."); }
            };

            const fireConfettiEffect = (rarity) => {
                if (rarity === 'legendary') {
                    const duration = 3000;
                    const end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffbf00', '#ffd700', '#ffffff', '#ff8c00'] });
                        confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffbf00', '#ffd700', '#ffffff', '#ff8c00'] });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#ffbf00', '#ffd700', '#ffffff', '#ff0000', '#00ff00', '#0000ff'] });
                } else if (rarity === 'epic') {
                    confetti({ particleCount: 50, spread: 80, origin: { y: 0.7 }, colors: ['#a855f7', '#9333ea', '#ffffff', '#e9d5ff'] });
                }
            };

            const handleEnterDraw = () => {
                if (!seatNumber.trim()) {
                    alert("⚠️ 系統警告：請先輸入勇者座號！");
                    return;
                }
                if (rewardPool.length === 0) {
                    alert("⚠️ 系統警告：卡池中沒有任何獎項！");
                    return;
                }
                setResults([]);
                setRollPhase('idle');
                setView('draw');
            };

            const handleDraw = () => {
                if (rollPhase !== 'idle' || rewardPool.length === 0) return;
                
                if ('speechSynthesis' in window) {
                    const warmup = new SpeechSynthesisUtterance('');
                    warmup.volume = 0;
                    window.speechSynthesis.speak(warmup);
                }

                const newResults = Array.from({ length: drawCount }, () => 
                    rewardPool[Math.floor(Math.random() * rewardPool.length)]
                );
                setResults(newResults);
                setRevealedIdxs([]);
                setRollPhase('charging');
                setShowFlash(false);

                playAudioEffects();

                setTimeout(() => {
                    setShowFlash(true);
                    setRollPhase('revealing');
                    
                    newResults.forEach((res, idx) => {
                        setTimeout(() => {
                            setRevealedIdxs(p => [...p, idx]);
                            fireConfettiEffect(res.rarity);
                            speakCardRarity(res.rarity); 
                            playCardRevealSound(res.rarity);
                        }, idx * 700); 
                    });
                    
                    setTimeout(() => {
                        setRollPhase('idle');
                        setShowFlash(false);
                        setHistory(p => [{ seat: seatNumber, count: drawCount, items: newResults, time: new Date().toLocaleTimeString() }, ...p].slice(0, 50));
                    }, newResults.length * 700 + 1500);
                }, 4000);
            };

            const updateItemCount = (idx, val) => {
                const newItems = [...items];
                newItems[idx].count = Math.max(0, parseInt(val) || 0);
                setItems(newItems);
            };

            // 🌟 新增：手動更新階級並同時替換顏色的功能 🌟
            const updateItemRarity = (idx, newRarity) => {
                const newItems = [...items];
                newItems[idx].rarity = newRarity;
                newItems[idx].color = rarityColorMap[newRarity]; // 自動套用對應階級的顏色
                setItems(newItems);
            };

            const handleAddNewItem = () => {
                if (!newItem.name.trim()) {
                    alert('請輸入獎項名稱！');
                    return;
                }
                const itemToAdd = { ...newItem, color: rarityColorMap[newItem.rarity], count: Math.max(0, parseInt(newItem.count) || 1) };
                setItems([...items, itemToAdd]);
                setNewItem({ name: '', detail: '', count: 1, rarity: 'common', icon: 'Star' }); 
            };

            const bgColor = view === 'draw' ? 'bg-black' : 'bg-[#FFF9F2]';

            const ExquisiteIcon = ({ name, className = "" }) => (
                <div className={`relative ${className}`}>
                    <Icon name={name} className="exquisite-icon icon-shadow w-full h-full text-black" />
                    <Icon name={name} className="exquisite-icon icon-neon w-full h-full" />
                    <Icon name={name} className="exquisite-icon icon-main-stroke w-full h-full" />
                </div>
            );

            return (
                <div className={`h-screen flex flex-col overflow-hidden transition-colors duration-1000 relative ${bgColor}`}>
                    
                    {rollPhase === 'charging' && <div className="fixed inset-0 z-0 warning-overlay"></div>}
                    {showFlash && <div className="fixed inset-0 z-[100] pointer-events-none animate-flash-bang"></div>}

                    <nav className={`${view==='draw'?'bg-black/60 border-slate-800':'bg-white/80 border-orange-100'} backdrop-blur-md shrink-0 sticky top-0 z-50 px-4 md:px-6 py-3 flex justify-between items-center shadow-sm border-b transition-colors duration-1000`}>
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                            <div className="bg-red-600 p-1.5 md:p-2 rounded-xl text-white shadow-[0_0_15px_rgba(220,38,38,0.8)]"><Icon name="Zap" className="w-5 h-5 md:w-6 md:h-6" /></div>
                            <span className={`text-lg md:text-xl font-black tracking-tight ${view==='draw'?'text-red-500 drop-shadow-[0_0_10px_rgba(220,38,38,0.8)]':'text-orange-600'}`}>終極抽卡陣</span>
                        </div>
                        <div className="flex gap-1 md:gap-4">
                            <button onClick={() => setView('home')} className={`flex items-center gap-1.5 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-bold transition-all ${view==='home'?'bg-orange-100 text-orange-600':view==='draw'?'text-slate-400 hover:text-white':'text-slate-500 hover:bg-slate-100'}`}>
                                <Icon name="Home" className="w-4 h-4 md:w-5 md:h-5" />
                                <span className="text-sm md:text-base hidden sm:inline">首頁</span>
                            </button>
                            <button onClick={handleEnterDraw} className={`flex items-center gap-1.5 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-bold transition-all ${view==='draw'?'bg-red-600 text-white shadow-[0_0_15px_rgba(220,38,38,0.8)]':'text-slate-500 hover:bg-slate-100'}`}>
                                <Icon name="Play" className="w-4 h-4 md:w-5 md:h-5" />
                                <span className="text-sm md:text-base hidden sm:inline">抽卡</span>
                            </button>
                            <button onClick={() => setView('admin')} className={`flex items-center gap-1.5 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-bold transition-all ${view==='admin'?'bg-orange-100 text-orange-600':view==='draw'?'text-slate-400 hover:text-white':'text-slate-500 hover:bg-slate-100'}`}>
                                <Icon name="Settings" className="w-4 h-4 md:w-5 md:h-5" />
                                <span className="text-sm md:text-base hidden sm:inline">管理</span>
                            </button>
                        </div>
                    </nav>

                    <main className={`flex-1 w-full max-w-6xl mx-auto p-2 sm:p-4 md:p-6 relative z-10 ${view === 'draw' ? 'overflow-hidden flex flex-col' : 'overflow-y-auto custom-scrollbar'}`}>
                        
                        {view === 'home' && (
                            <div className="animate-slide-up flex flex-col h-full justify-between pb-2">
                                <div>
                                    <div className="text-center mb-4 md:mb-6">
                                        <h2 className="text-2xl md:text-3xl font-black mb-1">傳說獎勵卡池</h2>
                                        <p className="text-slate-500 text-sm md:text-base font-bold">目前卡池深度：{totalCards} 張</p>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 gap-2 md:gap-3">
                                        {items.map((item, idx) => (
                                            <div key={idx} className={`bg-white p-2 md:p-3 rounded-2xl shadow-sm border-b-4 border-slate-200 hover:scale-105 hover:shadow-xl transition-all flex flex-col items-center justify-center text-center relative overflow-hidden ${item.rarity==='legendary'?'border-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.5)]':''}`}>
                                                {item.rarity === 'legendary' && <div className="absolute top-0 right-0 bg-yellow-400 text-yellow-900 text-[9px] font-black px-1.5 py-0.5 rounded-bl-lg">傳說</div>}
                                                <div className={`${item.color} w-8 h-8 md:w-10 md:h-10 rounded-xl flex items-center justify-center text-white mb-2 shrink-0 shadow-md`}>
                                                    <ExquisiteIcon name={item.icon} className={`w-5 h-5 md:w-6 md:h-6 ${item.rarity === 'legendary' ? 'legendary-card' : item.rarity === 'epic' ? 'epic-card' : item.rarity === 'rare' ? 'rare-card' : 'common-card'}`} />
                                                </div>
                                                <h3 className="font-bold text-xs md:text-sm leading-tight mb-1">{item.name}</h3>
                                                <div className="flex justify-between w-full mt-auto text-[10px] text-slate-500 font-bold">
                                                    <span>{item.count} 張</span>
                                                    <span className="text-orange-500">{totalCards > 0 ? Math.round((item.count/totalCards)*100) : 0}%</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="mt-6 bg-white p-4 md:p-6 rounded-[2rem] shadow-lg border-2 border-orange-100 flex flex-col md:flex-row items-center justify-between gap-4 shrink-0">
                                    <div className="flex flex-col sm:flex-row gap-4 items-center w-full md:w-auto">
                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                            <Icon name="Target" className="text-orange-500" />
                                            <input type="text" value={seatNumber} onChange={e=>setSeatNumber(e.target.value)} placeholder="輸入勇者座號" className="w-full sm:w-36 border-2 border-orange-200 bg-orange-50 text-slate-800 rounded-xl px-3 py-2 md:py-3 font-black text-lg md:text-xl text-center focus:border-orange-500 outline-none transition-colors placeholder:text-orange-300 placeholder:text-base placeholder:font-bold" />
                                        </div>
                                        <div className="flex gap-2">
                                            <span className="text-orange-400 font-bold self-center mr-1 hidden sm:inline">張數:</span>
                                            {[1, 2, 3, 4, 5].map(n => (
                                                <button key={n} onClick={()=>setDrawCount(n)} className={`w-10 h-10 md:w-12 md:h-12 rounded-xl font-black text-lg md:text-xl transition-all ${drawCount===n?'bg-orange-500 text-white shadow-[0_0_15px_rgba(249,115,22,0.6)] scale-110':'bg-orange-50 text-orange-400 hover:bg-orange-100'}`}>{n}</button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <button onClick={handleEnterDraw} className="w-full md:w-auto py-3 md:py-4 px-6 md:px-10 bg-gradient-to-r from-red-600 to-orange-500 text-white rounded-xl text-xl font-black shadow-[0_10px_20px_rgba(220,38,38,0.5)] flex items-center justify-center gap-2 hover:scale-[1.05] transition-transform">
                                        進入終極召喚陣 <Icon name="Skull" className="fill-white" />
                                    </button>
                                </div>

                            </div>
                        )}

                        {view === 'draw' && (
                            <div className="h-full flex flex-col w-full animate-zoom-in">
                                <div className={`flex-1 flex flex-col p-3 md:p-6 rounded-[30px] shadow-2xl relative overflow-hidden transition-all duration-300 ${rollPhase === 'charging' ? 'bg-slate-900 border-2 border-red-600 shadow-[0_0_60px_rgba(220,38,38,0.6)]' : 'bg-slate-800 border-2 border-slate-700'}`}>
                                    
                                    <div className="flex justify-between items-center mb-2 px-2 opacity-60">
                                        <span className="text-white font-bold tracking-widest text-sm">勇者座號：{seatNumber}</span>
                                        <span className="text-white font-bold tracking-widest text-sm">抽取數量：{drawCount}</span>
                                    </div>

                                    <div className="flex-1 flex flex-wrap justify-center items-center gap-3 sm:gap-4 md:gap-6 relative min-h-0 py-2">
                                        
                                        {rollPhase === 'idle' && results.length === 0 && (
                                            <div className="text-center w-full">
                                                <Icon name="Infinity" className="w-16 h-16 md:w-24 md:h-24 mx-auto text-slate-600 mb-4 opacity-50" />
                                                <div className="text-slate-500 text-xl md:text-3xl font-black tracking-widest text-center">魔法陣已準備就緒</div>
                                            </div>
                                        )}

                                        {(rollPhase === 'charging' || rollPhase === 'revealing' || rollPhase === 'idle') && results.length > 0 && (
                                            results.map((res, i) => {
                                                const isFlipped = revealedIdxs.includes(i) || rollPhase === 'idle';
                                                const glowClass = res.rarity === 'legendary' ? 'legendary-card' : res.rarity === 'epic' ? 'epic-card' : res.rarity === 'rare' ? 'rare-card' : 'common-card';

                                                return (
                                                    <div key={i} className={`card-container w-28 h-40 sm:w-32 sm:h-48 md:w-44 md:h-64 transition-all duration-300 ${rollPhase==='charging'?'animate-hyper-shake':''}`}>
                                                        <div className={`card-inner ${isFlipped ? 'flipped' : ''}`}>
                                                            
                                                            <div className="card-back shadow-[0_0_20px_rgba(0,0,0,0.8)]">
                                                                <div className="w-16 h-16 rounded-full border-4 border-slate-500 flex items-center justify-center animate-spin-slow">
                                                                    <Icon name="Star" className="text-slate-500 w-8 h-8" />
                                                                </div>
                                                                {rollPhase === 'charging' && <div className="absolute inset-0 bg-red-500/10 mix-blend-color-burn animate-pulse"></div>}
                                                            </div>
                                                            
                                                            <div className={`card-front bg-slate-800 flex items-center justify-center overflow-hidden border-4 ${glowClass}`}>
                                                                <div className="absolute inset-[-50%] overflow-hidden rounded-full mix-blend-screen opacity-30 z-0 pointer-events-none"><div className="bg-rays"></div></div>
                                                                
                                                                <div className={`relative z-10 w-full h-full flex flex-col items-center justify-center p-2 text-center ${res.color} text-white m-1 rounded-lg ${res.rarity === 'legendary' ? 'border-2 border-yellow-200' : res.rarity === 'epic' ? 'border-2 border-purple-200' : res.rarity === 'rare' ? 'border-2 border-cyan-200' : ''}`}>
                                                                    
                                                                    <div className="icon-area relative p-2 md:p-4 rounded-full mb-1 md:mb-3 shadow-inner border-2 border-white/10 shrink-0">
                                                                        <div className="icon-rays-inner"></div>
                                                                        <ExquisiteIcon name={res.icon} className="w-6 h-6 md:w-12 md:h-12" />
                                                                    </div>

                                                                    <div className="font-black text-base sm:text-lg md:text-xl tracking-wider drop-shadow-md leading-tight mb-0.5 w-full line-clamp-1 px-0.5">{res.name}</div>
                                                                    
                                                                    <div className="text-[9px] sm:text-[10px] md:text-xs mt-0.5 md:mt-1 opacity-95 font-bold bg-black/30 px-1.5 py-1 md:py-1.5 rounded w-full line-clamp-2 md:line-clamp-3 leading-snug">{res.detail}</div>
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                        
                                        {rollPhase === 'charging' && (
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none text-center w-full">
                                                <div className="text-white text-5xl md:text-7xl font-black tracking-widest drop-shadow-[0_5px_15px_rgba(220,38,38,1)] animate-pulse" style={{WebkitTextStroke: '2px #b91c1c'}}>突破臨界點</div>
                                            </div>
                                        )}
                                    </div>

                                    <button onClick={handleDraw} disabled={rollPhase !== 'idle'} className={`shrink-0 w-full mt-2 py-4 md:py-5 rounded-2xl text-2xl md:text-3xl font-black text-white transition-all ${rollPhase !== 'idle' ?'bg-slate-800 text-slate-600 border-2 border-slate-700':'bg-gradient-to-r from-red-600 via-orange-600 to-red-600 bg-[length:200%_auto] shadow-[0_0_20px_rgba(220,38,38,0.5)] hover:scale-[1.03] hover:shadow-[0_0_30px_rgba(220,38,38,0.8)]'}`} style={{ animation: rollPhase==='idle' ? 'pulse-glow 2s infinite' : 'none' }}>
                                        {rollPhase === 'charging' ? '💥 能量暴走中 💥' : rollPhase === 'revealing' ? '✨ 命運揭曉 ✨' : `立即審判 ${drawCount} 次`}
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-6 animate-slide-up pb-10">
                                <div className="bg-white p-4 md:p-6 rounded-3xl flex flex-col md:flex-row gap-4 justify-between md:items-center shadow-sm">
                                    <div><h3 className="font-black text-xl text-slate-800">系統管理</h3></div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>{if(confirm('警告：確定要重設為預設獎項？'))setItems(initialItems)}} className="bg-slate-200 px-4 py-2 rounded-xl font-bold hover:bg-slate-300 transition-colors flex-1 md:flex-none text-center text-slate-700">恢復預設</button>
                                        <button onClick={()=>setHistory([])} className="bg-red-500 text-white px-4 py-2 rounded-xl font-bold hover:bg-red-600 transition-colors shadow-md flex-1 md:flex-none text-center">清除紀錄</button>
                                    </div>
                                </div>

                                <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-200 border-l-8 border-l-green-400 relative overflow-hidden">
                                    <h4 className="font-bold flex items-center gap-2 text-lg text-slate-800 mb-4">
                                        <Icon name="PlusCircle" className="text-green-500" /> 新增自訂獎項
                                    </h4>
                                    <div className="grid grid-cols-1 md:grid-cols-5 gap-3 md:gap-4 items-end relative z-10">
                                        <div className="md:col-span-1">
                                            <label className="block text-sm font-bold text-slate-600 mb-1">獎項名稱</label>
                                            <input type="text" value={newItem.name} onChange={e=>setNewItem({...newItem, name: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700 outline-none focus:border-green-400 transition-colors" placeholder="例：作業減半" />
                                        </div>
                                        <div className="md:col-span-1">
                                            <label className="block text-sm font-bold text-slate-600 mb-1">詳細說明</label>
                                            <input type="text" value={newItem.detail} onChange={e=>setNewItem({...newItem, detail: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700 outline-none focus:border-green-400 transition-colors" placeholder="例：可免寫一半作業" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-600 mb-1">放入數量</label>
                                            <input type="number" value={newItem.count} onChange={e=>setNewItem({...newItem, count: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700 outline-none focus:border-green-400 transition-colors" min="1" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-600 mb-1">稀有等級</label>
                                            <select value={newItem.rarity} onChange={e=>setNewItem({...newItem, rarity: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700 outline-none focus:border-green-400 transition-colors bg-white">
                                                <option value="common">普通 (灰底)</option>
                                                <option value="rare">稀有 (藍底)</option>
                                                <option value="epic">史詩 (紫底)</option>
                                                <option value="legendary">傳說 (金底)</option>
                                            </select>
                                        </div>
                                        
                                        <div className="flex gap-2 items-center h-full">
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 shadow-inner ${newItem.rarity==='legendary'?'bg-gradient-to-br from-yellow-400 to-orange-500':newItem.rarity==='epic'?'bg-purple-500':newItem.rarity==='rare'?'bg-blue-500':'bg-stone-500'}`}>
                                                <ExquisiteIcon name={newItem.icon} className={`w-6 h-6 ${newItem.rarity === 'legendary' ? 'legendary-card' : newItem.rarity === 'epic' ? 'epic-card' : newItem.rarity === 'rare' ? 'rare-card' : 'common-card'}`} />
                                            </div>
                                            <div className="flex-1">
                                                <label className="block text-sm font-bold text-slate-600 mb-1">顯示圖示</label>
                                                <select value={newItem.icon} onChange={e=>setNewItem({...newItem, icon: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700 outline-none focus:border-green-400 transition-colors bg-white">
                                                    {availableIcons.map(icon => <option key={icon} value={icon}>{icon}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={handleAddNewItem} className="w-full mt-4 bg-green-500 text-white font-black py-3 rounded-xl hover:bg-green-600 transition-colors shadow-md flex items-center justify-center gap-2 relative z-10">
                                        <Icon name="Plus" /> 加入獎池
                                    </button>
                                </div>

                                <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-200">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left min-w-[600px]">
                                            <thead className="bg-slate-100">
                                                <tr>
                                                    <th className="px-6 py-4 text-slate-600 font-bold w-1/3">獎項</th>
                                                    <th className="px-6 py-4 text-slate-600 font-bold w-32">階級設定</th>
                                                    <th className="px-6 py-4 text-slate-600 font-bold">張數</th>
                                                    <th className="px-6 py-4 text-slate-600 font-bold">機率</th>
                                                    <th className="px-6 py-4 text-slate-600 font-bold">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {items.map((item, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                        <td className="px-6 py-4 font-bold flex items-center gap-3">
                                                            <div className={`${item.color} w-10 h-10 rounded-xl flex shrink-0 items-center justify-center text-white shadow-md relative overflow-hidden transition-colors duration-300`}>
                                                                <ExquisiteIcon name={item.icon} className={`w-5 h-5 ${item.rarity === 'legendary' ? 'legendary-card' : item.rarity === 'epic' ? 'epic-card' : item.rarity === 'rare' ? 'rare-card' : 'common-card'}`} />
                                                            </div>
                                                            <span className="text-lg text-slate-800 line-clamp-1">{item.name}</span>
                                                        </td>
                                                        {/* 🌟 新增的階級選擇器 🌟 */}
                                                        <td className="px-6 py-4">
                                                            <select 
                                                                value={item.rarity} 
                                                                onChange={e => updateItemRarity(idx, e.target.value)}
                                                                className="w-full border-2 border-slate-200 rounded-xl px-2 py-2 font-bold text-slate-700 outline-none focus:border-orange-400 transition-all bg-white"
                                                            >
                                                                <option value="common">普通 (灰)</option>
                                                                <option value="rare">稀有 (藍)</option>
                                                                <option value="epic">史詩 (紫)</option>
                                                                <option value="legendary">傳說 (金)</option>
                                                            </select>
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <input type="number" value={item.count} onChange={e=>updateItemCount(idx, e.target.value)} className="w-20 border-2 border-slate-200 rounded-xl text-center py-2 font-black text-lg text-slate-700 focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none transition-all" />
                                                        </td>
                                                        <td className="px-6 py-4 text-orange-600 font-black text-lg">
                                                            {totalCards>0?((item.count/totalCards)*100).toFixed(1):0}%
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <button onClick={()=>setItems(items.filter((_,i)=>i!==idx))} className="text-red-500 hover:text-white hover:bg-red-500 font-bold bg-red-50 px-4 py-2 rounded-xl transition-all shadow-sm">刪除</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-200 mt-6">
                                    <div className="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                                        <h4 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                            <Icon name="History" className="text-slate-500" /> 近期抽卡紀錄 (最多50筆)
                                        </h4>
                                    </div>
                                    <div className="overflow-x-auto">
                                        {history.length === 0 ? (
                                            <div className="p-8 text-center text-slate-500 font-bold">目前還沒有抽卡紀錄喔！</div>
                                        ) : (
                                            <table className="w-full text-left min-w-[600px]">
                                                <thead className="bg-slate-50">
                                                    <tr>
                                                        <th className="px-6 py-3 text-slate-600 font-bold w-1/5">時間</th>
                                                        <th className="px-6 py-3 text-slate-600 font-bold w-1/5">勇者座號</th>
                                                        <th className="px-6 py-3 text-slate-600 font-bold w-1/5">花費點數</th>
                                                        <th className="px-6 py-3 text-slate-600 font-bold">獲得獎項</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {history.map((record, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-6 py-4 text-slate-500 font-bold">{record.time}</td>
                                                            <td className="px-6 py-4 font-black text-lg text-slate-800">
                                                                <span className="bg-slate-200 px-3 py-1 rounded-lg">{record.seat}</span>
                                                            </td>
                                                            <td className="px-6 py-4 font-black text-lg text-orange-500">
                                                                {record.count * 10} 點
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <div className="flex flex-wrap gap-2">
                                                                    {record.items.map((item, i) => (
                                                                        <span key={i} className={`text-xs md:text-sm font-bold px-2 py-1 rounded text-white shadow-sm ${item.color}`}>
                                                                            {item.name}
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>

                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
