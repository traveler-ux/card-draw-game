<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獎勵萌抽卡 - 終極史詩版 v3.0</title>
    <!-- 使用 CDN 載入必要的套件 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 canvas-confetti 彩帶與金幣特效套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; margin: 0; overflow: hidden; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fed7aa; border-radius: 10px; }
        
        /* 基礎動畫 */
        @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-zoom-in { animation: zoom-in 0.4s ease-out forwards; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

        /* --- 💥 終極特效區 💥 --- */
        @keyframes hyper-shake {
            0%, 100% { transform: translate(0, 0) rotate(0) scale(1); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, -5px) rotate(-3deg) scale(1.03); }
            20%, 40%, 60%, 80% { transform: translate(5px, 5px) rotate(3deg) scale(0.97); }
        }
        .animate-hyper-shake { animation: hyper-shake 0.08s ease-in-out infinite; }
        
        @keyframes warning-pulse {
            0%, 100% { box-shadow: inset 0 0 25px rgba(220, 38, 38, 0); background-color: rgba(220, 38, 38, 0); }
            50% { box-shadow: inset 0 0 120px rgba(220, 38, 38, 0.5); background-color: rgba(220, 38, 38, 0.15); }
        }
        .warning-overlay { animation: warning-pulse 0.4s infinite; pointer-events: none; }

        .card-container { perspective: 1200px; }
        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 1.2rem;
            overflow: hidden;
        }
        .card-back {
            background: repeating-linear-gradient(45deg, #1e293b, #1e293b 12px, #334155 12px, #334155 24px);
            border: 4px solid #64748b;
            display: flex; justify-content: center; align-items: center;
        }
        .card-front { transform: rotateY(180deg); }

        /* ✨ 炫彩雷射閃卡 (Holographic Foil) 特效 ✨ */
        .holo-foil {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, 
                rgba(255,0,0,0.2) 0%, 
                rgba(255,154,0,0.2) 15%, 
                rgba(208,222,33,0.2) 30%, 
                rgba(79,220,74,0.2) 45%, 
                rgba(63,218,216,0.2) 60%, 
                rgba(47,201,226,0.2) 75%, 
                rgba(28,127,238,0.2) 90%, 
                rgba(95,21,242,0.2) 100%);
            background-size: 300% 300%;
            mix-blend-mode: color-dodge;
            opacity: 0.7;
            pointer-events: none;
            animation: holo-shift 4s ease infinite alternate;
        }
        @keyframes holo-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flash-bang {
            0% { opacity: 1; background-color: #ffffff; }
            100% { opacity: 0; background-color: #ffffff; display: none; }
        }
        .animate-flash-bang { animation: flash-bang 1.2s ease-out forwards; }

        @keyframes legendary-glow {
            0%, 100% { box-shadow: 0 0 45px #fbbf24, inset 0 0 30px #fbbf24; border-color: #fef08a; }
            50% { box-shadow: 0 0 110px #f59e0b, inset 0 0 60px #f59e0b; border-color: #ffffff; }
        }
        .legendary-card { animation: legendary-glow 1.2s infinite alternate; }

        @keyframes epic-glow {
            0%, 100% { box-shadow: 0 0 45px #a855f7, inset 0 0 30px #a855f7; border-color: #d8b4fe; }
            50% { box-shadow: 0 0 100px #9333ea, inset 0 0 50px #9333ea; border-color: #ffffff; }
        }
        .epic-card { animation: epic-glow 1.2s infinite alternate; }

        @keyframes rare-glow {
            0%, 100% { box-shadow: 0 0 40px #0ea5e9, inset 0 0 25px #0ea5e9; border-color: #7dd3fc; }
            50% { box-shadow: 0 0 90px #0284c7, inset 0 0 45px #0284c7; border-color: #38bdf8; }
        }
        .rare-card { animation: rare-glow 1.2s infinite alternate; }

        .bg-rays {
            position: absolute; top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.6) 20deg, transparent 40deg, rgba(255,255,255,0.6) 60deg, transparent 80deg, rgba(255,255,255,0.6) 100deg, transparent 120deg, rgba(255,255,255,0.6) 140deg, transparent 160deg, rgba(255,255,255,0.6) 180deg, transparent 200deg, rgba(255,255,255,0.6) 220deg, transparent 240deg, rgba(255,255,255,0.6) 260deg, transparent 280deg, rgba(255,255,255,0.6) 300deg, transparent 320deg, rgba(255,255,255,0.6) 340deg, transparent 360deg);
            animation: spin-slow 10s linear infinite; z-index: -1;
        }

        .icon-area { position: relative; }
        .exquisite-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .icon-shadow { opacity: 0.4; filter: blur(1.5px); color: #000; scale: 1.05; }
        .icon-neon { stroke-width: 3; filter: drop-shadow(0 0 6px currentColor); opacity: 0.9; }
        .icon-main-stroke { stroke-width: 2.5; filter: drop-shadow(0 0 1px currentColor); }

        .legendary-card .icon-neon, .legendary-card .icon-main-stroke { color: #fef08a; }
        .epic-card .icon-neon, .epic-card .icon-main-stroke { color: #d8b4fe; }
        .rare-card .icon-neon, .rare-card .icon-main-stroke { color: #7dd3fc; }
        .common-card .icon-neon, .common-card .icon-main-stroke { color: #f1f5f9; }

        @keyframes ssr-modal-bounce {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-ssr-modal { animation: ssr-modal-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const Icon = ({ name, className }) => {
            return <i data-lucide={name.toLowerCase()} className={className}></i>;
        };

        const availableIcons = ['Star', 'Gift', 'Heart', 'Zap', 'Crown', 'Shield-Alert', 'Coffee', 'Music', 'Sparkles', 'Map-Pin', 'Cookie', 'Flame', 'Thumbs-Up', 'Smile', 'Sun', 'Moon', 'Book', 'User-Check', 'Chevron-Right', 'Plus', 'PlusCircle', 'History'];

        const rarityColorMap = {
            common: 'bg-stone-500',
            rare: 'bg-blue-500',
            epic: 'bg-purple-500',
            legendary: 'bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600'
        };

        // 🌟 預設卡池包含 AI 原畫圖片 🌟
        const initialItems = [
            { name: "再抽1+1", detail: "好運連連，再抽兩張", count: 1, icon: 'Flame', color: 'bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600', rarity: 'legendary', image: 'images/card_legendary_flame.jpg' },
            { name: "老師座", detail: "可坐老師的座位半天", count: 4, icon: 'Crown', color: 'bg-purple-500', rarity: 'epic', image: 'images/card_epic_crown.jpg' },
            { name: "免死金牌", detail: "抵銷一次處罰", count: 5, icon: 'Shield-Alert', color: 'bg-purple-500', rarity: 'epic', image: 'images/card_epic_shield.jpg' },
            { name: "點歌時間", detail: "可以在12:30前點歌在班上放", count: 15, icon: 'Music', color: 'bg-purple-500', rarity: 'epic' },
            { name: "活動大進擊", detail: "全班增加活動時間", count: 5, icon: 'Zap', color: 'bg-purple-500', rarity: 'epic' },
            { name: "短文免寫", detail: "短文免寫二次", count: 10, icon: 'Star', color: 'bg-blue-500', rarity: 'rare' },
            { name: "免午休", detail: "獲得3天自由午休時間", count: 10, icon: 'Coffee', color: 'bg-blue-500', rarity: 'rare' },
            { name: "值日生", detail: "值日生PASS一次", count: 10, icon: 'User-Check', color: 'bg-blue-500', rarity: 'rare' },
            { name: "聯絡簿讚美", detail: "獲得老師的讚美", count: 9, icon: 'Sparkles', color: 'bg-blue-500', rarity: 'rare' },
            { name: "三日座位", detail: "自選座位三天", count: 5, icon: 'Map-Pin', color: 'bg-blue-500', rarity: 'rare' },
            { name: "優先選擇", detail: "獲得優先選擇權", count: 10, icon: 'Chevron-Right', color: 'bg-blue-500', rarity: 'rare' },
            { name: "零食時間", detail: "獲得吃零食的自由時間", count: 10, icon: 'Cookie', color: 'bg-blue-500', rarity: 'rare' },
            { name: "記得微笑", detail: "老師請記得微笑", count: 1, icon: 'Heart', color: 'bg-stone-500', rarity: 'common' },
            { name: "命運的小禮物", detail: "由轉盤抽出小禮物", count: 5, icon: 'Gift', color: 'bg-stone-500', rarity: 'common' },
        ];

        function App() {
            const [view, setView] = useState('home');
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [activeClass, setActiveClass] = useState('501班');
            
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('epicRewards_items_v6');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return parsed.map(item => ({...item, color: rarityColorMap[item.rarity] || item.color}));
                }
                return initialItems;
            });

            const [drawCount, setDrawCount] = useState(1);
            const [rollPhase, setRollPhase] = useState('idle');
            const [showFlash, setShowFlash] = useState(false);
            const [results, setResults] = useState([]);
            const [revealedIdxs, setRevealedIdxs] = useState([]);
            const [ssrModalItem, setSsrModalItem] = useState(null);

            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('epicRewards_history_v6');
                return saved ? JSON.parse(saved) : [];
            });
            const [seatNumber, setSeatNumber] = useState('');
            const [newItem, setNewItem] = useState({ name: '', detail: '', count: 1, rarity: 'common', icon: 'Star', image: '' });

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('epicRewards_items_v6', JSON.stringify(items));
                localStorage.setItem('epicRewards_history_v6', JSON.stringify(history));
                if (window.lucide) window.lucide.createIcons();
            }, [items, history, view, results, rollPhase, revealedIdxs, ssrModalItem]);

            const totalCards = useMemo(() => items.reduce((sum, item) => sum + item.count, 0), [items]);
            const rewardPool = useMemo(() => {
                let pool = [];
                items.forEach(item => {
                    for (let i = 0; i < item.count; i++) pool.push(item);
                });
                return pool;
            }, [items]);

            // 🔊 真實 Web Audio API 升級音效
            const playAudioEffects = () => {
                if (!soundEnabled) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    if (ctx.state === 'suspended') ctx.resume();
                    const now = ctx.currentTime;

                    const riserOsc = ctx.createOscillator();
                    const riserGain = ctx.createGain();
                    riserOsc.connect(riserGain); riserGain.connect(ctx.destination);
                    riserOsc.type = 'sawtooth';
                    riserOsc.frequency.setValueAtTime(50, now);
                    riserOsc.frequency.exponentialRampToValueAtTime(1600, now + 3.8);
                    riserGain.gain.setValueAtTime(0, now);
                    riserGain.gain.linearRampToValueAtTime(0.15, now + 0.5);
                    riserGain.gain.exponentialRampToValueAtTime(0.001, now + 4);
                    riserOsc.start(now); riserOsc.stop(now + 4.1);

                    const ticks = 45;
                    for (let i = 0; i < ticks; i++) {
                        const progress = i / ticks;
                        const timeOffset = 3.8 * Math.pow(progress, 1.6);
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(450 + (progress * 900), now + timeOffset);
                        gain.gain.setValueAtTime(0, now + timeOffset);
                        gain.gain.linearRampToValueAtTime(0.12, now + timeOffset + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + 0.04);
                        osc.start(now + timeOffset); osc.stop(now + timeOffset + 0.08);
                    }
                } catch (e) {}
            };

            const playCardRevealSound = (rarity) => {
                if (!soundEnabled) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    if (ctx.state === 'suspended') ctx.resume();
                    const now = ctx.currentTime;

                    if (rarity === 'legendary') {
                        // 🎺 傳說 (SSR) 皇室登場合音
                        [392, 523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                            osc.connect(gain); gain.connect(ctx.destination);
                            gain.gain.setValueAtTime(0, now + idx * 0.08);
                            gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.08 + 0.05);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 1.8);
                            osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 2.0);
                        });
                        return;
                    }

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);

                    if (rarity === 'common') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                        osc.start(now); osc.stop(now + 0.15);
                    } else if (rarity === 'rare') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(587.33, now);
                        osc.frequency.setValueAtTime(880, now + 0.08);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.35, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now); osc.stop(now + 0.45);
                    } else if (rarity === 'epic') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(783.99, now + 0.1);
                        osc.frequency.setValueAtTime(1046.5, now + 0.2);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc.start(now); osc.stop(now + 0.65);
                    }
                } catch (e) {}
            };

            const speakCardRarity = (rarity) => {
                if (!soundEnabled) return;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let text = rarity === 'legendary' ? "傳說！神話降臨！" : rarity === 'epic' ? "史詩獎勵！" : "";
                    if (text !== "") {
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'zh-TW';
                        utterance.rate = 0.9;
                        utterance.pitch = rarity === 'legendary' ? 0.9 : 0.8;
                        window.speechSynthesis.speak(utterance);
                    }
                }
            };

            // 🎉 傳說卡大爆發：黃金金幣雨粒子
            const fireConfettiEffect = (rarity) => {
                if (rarity === 'legendary') {
                    const duration = 3500;
                    const end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 8, angle: 60, spread: 65, origin: { x: 0 }, colors: ['#ffd700', '#ffbf00', '#ffffff', '#ff4500'] });
                        confetti({ particleCount: 8, angle: 120, spread: 65, origin: { x: 1 }, colors: ['#ffd700', '#ffbf00', '#ffffff', '#ff4500'] });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                    confetti({ particleCount: 180, spread: 110, origin: { y: 0.5 }, colors: ['#ffd700', '#ffbf00', '#ffffff', '#eab308'] });
                } else if (rarity === 'epic') {
                    confetti({ particleCount: 65, spread: 85, origin: { y: 0.65 }, colors: ['#a855f7', '#c084fc', '#ffffff', '#e9d5ff'] });
                }
            };

            const handleEnterDraw = () => {
                if (!seatNumber.trim()) {
                    alert("⚠️ 系統警告：請先輸入勇者座號！");
                    return;
                }
                if (rewardPool.length === 0) {
                    alert("⚠️ 系統警告：卡池中沒有任何獎項！");
                    return;
                }
                setResults([]);
                setRollPhase('idle');
                setView('draw');
            };

            const handleDraw = () => {
                if (rollPhase !== 'idle' || rewardPool.length === 0) return;
                
                const newResults = Array.from({ length: drawCount }, () => 
                    rewardPool[Math.floor(Math.random() * rewardPool.length)]
                );
                setResults(newResults);
                setRevealedIdxs([]);
                setRollPhase('charging');
                setShowFlash(false);
                setSsrModalItem(null);

                playAudioEffects();

                setTimeout(() => {
                    setShowFlash(true);
                    setRollPhase('revealing');
                    
                    let foundLegendary = null;

                    newResults.forEach((res, idx) => {
                        setTimeout(() => {
                            setRevealedIdxs(p => [...p, idx]);
                            fireConfettiEffect(res.rarity);
                            speakCardRarity(res.rarity);
                            playCardRevealSound(res.rarity);

                            if (res.rarity === 'legendary') {
                                foundLegendary = res;
                            }
                        }, idx * 700);
                    });
                    
                    setTimeout(() => {
                        setRollPhase('idle');
                        setShowFlash(false);
                        if (foundLegendary) {
                            setSsrModalItem(foundLegendary);
                        }
                        setHistory(p => [{ seat: seatNumber, count: drawCount, items: newResults, time: new Date().toLocaleTimeString(), class: activeClass }, ...p].slice(0, 50));
                    }, newResults.length * 700 + 1200);
                }, 3800);
            };

            const updateItemCount = (idx, val) => {
                const newItems = [...items];
                newItems[idx].count = Math.max(0, parseInt(val) || 0);
                setItems(newItems);
            };

            const updateItemRarity = (idx, newRarity) => {
                const newItems = [...items];
                newItems[idx].rarity = newRarity;
                newItems[idx].color = rarityColorMap[newRarity];
                setItems(newItems);
            };

            const handleAddNewItem = () => {
                if (!newItem.name.trim()) {
                    alert('請輸入獎項名稱！');
                    return;
                }
                const itemToAdd = { ...newItem, color: rarityColorMap[newItem.rarity], count: Math.max(0, parseInt(newItem.count) || 1) };
                setItems([...items, itemToAdd]);
                setNewItem({ name: '', detail: '', count: 1, rarity: 'common', icon: 'Star', image: '' });
            };

            // 📥 匯出卡池 JSON 檔
            const exportConfigJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ class: activeClass, items }, null, 2));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", `獎勵卡池_${activeClass}_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
            };

            // 📤 匯入卡池 JSON 檔
            const importConfigJSON = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (Array.isArray(parsed.items)) {
                                setItems(parsed.items);
                                if (parsed.class) setActiveClass(parsed.class);
                                alert('✅ 卡池 JSON 設定已成功匯入！');
                            } else { alert('❌ JSON 格式錯誤！'); }
                        } catch (err) { alert('❌ 讀取 JSON 檔案失敗！'); }
                    };
                }
            };

            const bgColor = view === 'draw' ? 'bg-black' : 'bg-[#FFF9F2]';

            const ExquisiteIcon = ({ name, className = "" }) => (
                <div className={`relative ${className}`}>
                    <Icon name={name} className="exquisite-icon icon-shadow w-full h-full text-black" />
                    <Icon name={name} className="exquisite-icon icon-neon w-full h-full" />
                    <Icon name={name} className="exquisite-icon icon-main-stroke w-full h-full" />
                </div>
            );

            return (
                <div className={`h-screen flex flex-col overflow-hidden transition-colors duration-1000 relative ${bgColor}`}>
                    
                    {rollPhase === 'charging' && <div className="fixed inset-0 z-0 warning-overlay"></div>}

                                                                <option value="rare">稀有 (藍)</option>
                                                                <option value="epic">史詩 (紫)</option>
                                                                <option value="legendary">傳說 (金)</option>
                                                            </select>
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <input type="number" value={item.count} onChange={e=>updateItemCount(idx, e.target.value)} className="w-20 border-2 border-slate-200 rounded-xl text-center py-2 font-black text-lg text-slate-700 focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none transition-all" />
                                                        </td>
                                                        <td className="px-6 py-4 text-orange-600 font-black text-lg">
                                                            {totalCards>0?((item.count/totalCards)*100).toFixed(1):0}%
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <button onClick={()=>setItems(items.filter((_,i)=>i!==idx))} className="text-red-500 hover:text-white hover:bg-red-500 font-bold bg-red-50 px-4 py-2 rounded-xl transition-all shadow-sm">刪除</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-200 mt-6">
                                    <div className="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                                        <h4 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                            <Icon name="History" className="text-slate-500" /> 近期抽卡紀錄 (最多50筆)
                                        </h4>
                                    </div>
                                    <div className="overflow-x-auto">
                                        {history.length === 0 ? (
                                            <div className="p-8 text-center text-slate-500 font-bold">目前還沒有抽卡紀錄喔！</div>
                                        ) : (
                                            <table className="w-full text-left min-w-[600px]">
                                                <thead className="bg-slate-50">
                                                    <tr>
                                                        <th className="px-6 py-3 text-slate-600 font-bold w-1/5">時間</th>
                                                        <th className="px-6 py-3 text-slate-600 font-bold w-1/5">勇者座號 (班級)</th>
                                                        <th className="px-6 py-3 text-slate-600 font-bold w-1/5">花費點數</th>
                                                        <th className="px-6 py-3 text-slate-600 font-bold">獲得獎項</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {history.map((record, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-6 py-4 text-slate-500 font-bold">{record.time}</td>
                                                            <td className="px-6 py-4 font-black text-lg text-slate-800">
                                                                <span className="bg-slate-200 px-3 py-1 rounded-lg">{record.seat}號 ({record.class||'501班'})</span>
                                                            </td>
                                                            <td className="px-6 py-4 font-black text-lg text-orange-500">
                                                                {record.count * 10} 點
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <div className="flex flex-wrap gap-2">
                                                                    {record.items.map((item, i) => (
                                                                        <span key={i} className={`text-xs md:text-sm font-bold px-2 py-1 rounded text-white shadow-sm ${item.color}`}>
                                                                            {item.name}
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>

                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
